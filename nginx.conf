server {
    listen 8080;
    root /var/www/html/public;
    index index.php index.html;

    # Лимит на загрузку фото (товары/категории/баннеры/блог/аватар) — должен
    # быть не меньше post_max_size в php.ini (см. Dockerfile), иначе nginx
    # обрежет запрос раньше, чем до него дойдёт Laravel-валидация
    client_max_body_size 100m;

    # Редиректы (например, слэш у каталогов) должны быть относительными:
    # абсолютные подставляют внутренний порт 8080 и http вместо https
    absolute_redirect off;

    # Сжатие ответов: JSON API и бандлы фронта уменьшаются в разы
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # Ассеты Nuxt имеют хеш в имени — можно кешировать навсегда
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA (Online-Store_front: pwa/sw.ts, @vite-pwa/nuxt). sw.js и манифест
    # браузер должен перепроверять при каждой загрузке, иначе новая версия
    # приложения не дойдёт до установленных PWA. =404 вместо фолбэка на
    # Laravel: без файла отдавался бы 200.html с кодом 200, и браузер пытался
    # бы зарегистрировать HTML как service worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Загруженные файлы (фото товаров, аватары, баннеры): sandbox запрещает
    # скрипты, если среди них окажется SVG/HTML — иначе файл на том же домене
    # мог бы прочитать токен админа из localStorage. Загрузка SVG закрыта и
    # валидацией (mimes:jpeg,png,jpg,webp), это второй рубеж.
    location /storage/ {
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        try_files $uri =404;
    }

    # Иконки и splash-экраны меняются только со сменой логотипа
    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}
