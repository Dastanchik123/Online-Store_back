<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Нет подключения — KurulushStore</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #0f172a;
    }
    header {
      background: #0f172a;
      padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1.25rem 0.9rem;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    header span { color: #38bdf8; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      padding: 2.25rem 1.75rem;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    }
    .card img { width: 88px; height: 88px; }
    h1 { font-size: 1.35rem; margin: 1.25rem 0 0.5rem; }
    p { color: #64748b; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 50px;
      background: #38bdf8;
      color: #0f172a;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 0.8rem 1.75rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <header>Kurulush<span>Store</span></header>
  <main>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Нет подключения к интернету</h1>
      <p>Эта страница ещё не сохранена на устройстве. Проверьте Wi-Fi или мобильный интернет — страница откроется сама, как только связь появится.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
